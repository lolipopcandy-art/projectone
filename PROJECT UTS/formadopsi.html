<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Adopsi</title>
</head>
<body>
            <h2 class="form-title" align="center">Formulir Identitas & Ketersediaan Adopter</h2>
            <p class="form-desc" align="center">Wajib diisi lengkap sebelum mengadopsi hewan yang dipilih.</p>
<form action="" method="post">
<table align="center">
  <tr>
    <td>Nama</td>
    <td><input type="text" name="txtuser" id="" placeholder="Masukkan nama kamu"></td>
  </tr>
    <td>Masukkan Nama Dan Jenis Hewan</td>
    <td><input type="text" name="txthewan" id="" placeholder="Contoh : Rahmat (Kucing)"></td>
  </tr>
  <tr>
    <td>Nomor WhatsApp Aktif</td>
    <td><input type="tel" name="txtnumber" id="" placeholder="misal 081247652937"></td>
  </tr>
  <tr>
    <td>Alamat Domisili Lengkap</td>
    <td><textarea name="txtalamat" id="" cols="30" rows="10" placeholder="masukkan alamat lengkap"></textarea></td>
  </tr>
  <tr>
    <td>Ketersediaan</td>
    <td><input type="checkbox" name="ready" id=""> Saya bersedia merawat hewan dengan penuh tanggung jawab dan tidak menelantarkannya. </td>
  </tr>

    
  <tr>
      <td><input type="submit" value="Kirim" name="cmdlogin"></td>
  </tr>
</table>
</form>
</body>
</html>
